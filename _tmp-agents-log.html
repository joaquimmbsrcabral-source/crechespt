  <script>
function fmtDate(d){
  try {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('pt-PT', { weekday:'long', day:'numeric', month:'long' });
  } catch(e){ return d; }
}

function render(){
  const raw = JSON.parse(document.getElementById('log-data').textContent || '{"entries":[]}');
  const entries = (raw.entries || []).slice().sort((a,b) => {
    const ka = a.date + ' ' + (a.time||''), kb = b.date + ' ' + (b.time||'');
    return kb.localeCompare(ka);
  });

  const cutoff = Date.now() - 7*86400000;
  const seen = new Map();
  entries.forEach(e => {
    const t = new Date(e.date + 'T' + (e.time||'00:00')).getTime();
    if(t >= cutoff && !seen.has(e.agent)) seen.set(e.agent, e.emoji || '\u{1F916}');
  });
  const activeRow = document.getElementById('activeRow');
  if(seen.size === 0){
    activeRow.innerHTML = '<span class="chip"><span class="dot" style="background:#C9C5D8"></span>Ainda sem agents ativos esta semana</span>';
  } else {
    activeRow.innerHTML = [...seen.entries()].map(([agent, emoji]) =>
      `<span class="chip"><span class="dot"></span>${emoji} ${agent}</span>`
    ).join('');
  }

  const log = document.getElementById('log');
  if(entries.length === 0){
    log.innerHTML = '<div class="empty">Ainda não há registos.</div>';
    return;
  }

  let html = '';
  let lastDate = null;
  entries.forEach(e => {
    if(e.date !== lastDate){
      html += `<div class="date-heading">${fmtDate(e.date)}</div>`;
      lastDate = e.date;
    }
    const status = ['ok','attention','info','error'].includes(e.status) ? e.status : 'info';
    html += `
      <div class="entry">
        <div class="stripe ${status}"></div>
        <div class="entry-body">
          <div class="entry-top">
            <span class="entry-agent">${e.emoji || '\u{1F916}'} ${e.agent || 'Agent'}</span>
            <span class="entry-time">${e.time || ''}</span>
          </div>
          <div class="entry-title">${e.title || ''}</div>
          <div class="entry-summary">${e.summary || ''}</div>
        </div>
      </div>`;
  });
  log.innerHTML = html;
}
render();
</script>
